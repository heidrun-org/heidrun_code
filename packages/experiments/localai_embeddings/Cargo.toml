[package]
name = "localai_embeddings"
version = "0.3.5"
description = "Computes local text embeddings with a Rust library and command line tool"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "localai_embeddings"
path = "src/lib.rs"

[[bin]]
name = "localai_embeddings"
path = "src/main.rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
anyhow = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4", features = ["derive"] }
hf-hub = { version = "1", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", features = ["fancy-regex"] }
