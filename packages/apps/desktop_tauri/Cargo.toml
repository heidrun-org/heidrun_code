[package]
name = "heidrun_code"
version = "0.3.0"
description = "Interface graphique pour Herdr"
license = "MIT"
edition = "2021"

[lib]
name = "heidrun_code_lib"
# Only the iOS and Android versions of Tauri need the kinds staticlib and cdylib, and Heidrun Code has neither. Each
# build wrote a static library of 737 MB that the desktop executable never used (issue 915).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "process", "macros"] }
# Runs the coding agent tools (codex, claude): the package of the repository that the change log generator uses too
coding_agent_cli = { path = "../../auxiliary/coding_agent_cli" }
# Finds the chat session files of Claude Code and of Codex, and reads what each one holds
data_layer_coding_agents = { path = "../../../submodules/heidrun_data/packages/data_layer_coding_agents" }
# Reads the user activity records of the developer into the SQLite file of the data layer, for the Statistics window
data_layer_user_activity = { path = "../../../submodules/heidrun_data/packages/data_layer_user_activity" }
# Reads the commits of a repository into the SQLite file of the data layer, for the Statistics window
data_layer_source_control = { path = "../../../submodules/heidrun_data/packages/data_layer_source_control" }
# Reads the pull requests and the issues of a repository into the SQLite file of the data layer, for the Statistics window
data_layer_code_hosting = { path = "../../../submodules/heidrun_data/packages/data_layer_code_hosting" }
# The one lock of the SQLite file of the data layer, which the command line heidrun_data takes too
heidrun_data = { path = "../../../submodules/heidrun_data/packages/heidrun_data" }
# The format of the macro files, which the command line heidrun_code_ctrl changes too: the hard-coded macros and the personal macros
heidrun_code_ctrl = { path = "../../auxiliary/heidrun_code_ctrl" }
# The voice input: it records the microphone, downloads a Whisper model, and changes the speech into text on the computer
voice_input = { path = "../../auxiliary/voice_input" }
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Mobile access (a phone through an ngrok tunnel): the server that serves the mobile website and checks the pairing key
mobile_server = { path = "../../auxiliary/mobile_server" }
# Deleting from the file explorer goes to the macOS Trash
trash = "5"
tauri-plugin-dialog = "2"
# The position and the size of the window come back at the next start
tauri-plugin-window-state = "2"
# Skills: the search on skills.sh and the download from GitHub
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The file .env of the developer: its variables go into the environment, in a development build only
dotenvy = "0.15"

[dev-dependencies]
# The tests write a compressed file of Codex, as Codex does for its old chat sessions
zstd = "0.14"
