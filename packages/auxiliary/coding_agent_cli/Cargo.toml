[package]
name = "coding_agent_cli"
version = "0.3.5"
description = "Sends one prompt to a coding agent command line tool (codex, claude, or agy) and returns the answer"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "coding_agent_cli"
path = "src/lib.rs"

[[bin]]
name = "coding_agent_cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
