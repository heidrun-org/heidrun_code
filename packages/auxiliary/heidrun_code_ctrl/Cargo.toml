[package]
name = "heidrun_code_ctrl"
version = "0.4.5"
description = "The command line that controls the Heidrun Code application, for a coding agent"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "heidrun_code_ctrl"
path = "src/lib.rs"

[[bin]]
name = "heidrun_code_ctrl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feature "preserve_order" keeps the keys of the file .heidrun/config.json in their order when the command line changes it
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
trash = "5"
walkdir = "2"
sha2 = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
