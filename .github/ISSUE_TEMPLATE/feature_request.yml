name: Feature request
description: Suggest an idea for Heidrun Code. The goat listens to every einherjar.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation first, not the solution. What is hard or slow today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature as you imagine it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways to solve it
      description: Did you try something else? Is there a workaround?
  - type: textarea
    id: context
    attributes:
      label: Other information
      description: Add a screenshot or a link if it helps.
